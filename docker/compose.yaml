services:
  trainer:
    image: ${TRAINING_IMAGE_TAG:-quake-ai-trainer-amd:local}
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - QUAKE_BASEDIR=/workspace/assets
      - QUAKE_AI_DEVICE=${QUAKE_AI_DEVICE:-gpu}
      - QUAKE_AI_ARTIFACT_ROOT=/workspace/assets
      - ROCBLAS_USE_HIPBLASLT=${ROCBLAS_USE_HIPBLASLT:-0}
      - HSA_ENABLE_DXG_DETECTION=${HSA_ENABLE_DXG_DETECTION:-1}
      - HIP_VISIBLE_DEVICES
      - ROCR_VISIBLE_DEVICES
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-}
      # Thread pool tuning is handled per-process: rollout workers get
      # OMP_NUM_THREADS=1 via monkey-patch in train.py, while learner and
      # inference workers keep their default thread counts for peak throughput.
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE:?Set HOST_WORKSPACE to the host repo path}
        target: /workspace
      - type: bind
        source: ${WSL_LIBDXCORE_PATH:-/usr/lib/wsl/lib/libdxcore.so}
        target: /usr/lib/libdxcore.so
        read_only: true
      - type: bind
        source: ${WSL_LIBROCDXG_PATH:-/opt/rocm/lib/librocdxg.so}
        target: /usr/lib/librocdxg.so
        read_only: true
      - type: volume
        source: quake-ai-pip-cache
        target: /home/trainer/.cache/pip
      - type: volume
        source: quake-ai-miopen-cache
        target: /home/trainer/.config/miopen
    devices:
      - /dev/dxg:/dev/dxg
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    ipc: host
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    stdin_open: true
    tty: true

volumes:
  quake-ai-pip-cache:
  quake-ai-miopen-cache:
