services:
  trainer:
    image: ${TRAINING_IMAGE_TAG:-qnn-trainer-amd:local}
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - QUAKE_BASEDIR=/workspace/assets
      - QNN_DEVICE=${QNN_DEVICE:-gpu}
      - QNN_ARTIFACT_ROOT=/workspace/assets
      - ROCBLAS_USE_HIPBLASLT=${ROCBLAS_USE_HIPBLASLT:-1}
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-1}
      - TORCHINDUCTOR_CACHE_DIR=${TORCHINDUCTOR_CACHE_DIR:-/home/trainer/.cache/torch/inductor}
      - HSA_ENABLE_DXG_DETECTION=${HSA_ENABLE_DXG_DETECTION:-1}
      - HIP_VISIBLE_DEVICES
      - ROCR_VISIBLE_DEVICES
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-}
      # Thread pool tuning is handled per-process: rollout workers get
      # OMP_NUM_THREADS=1 via monkey-patch in train.py, while learner and
      # inference workers keep their default thread counts for peak throughput.
    volumes:
      # HOST_WORKSPACE is the canonical env (set by the devcontainer). For
      # worktree-based code edits the user can override HOST_CODE to point
      # at a worktree's host path; HOST_DATA stays at the unified data
      # root (assets/, artifacts/, vendor/). Both default to
      # HOST_WORKSPACE so unconfigured launches behave exactly as before.
      - type: bind
        source: ${HOST_CODE:-${HOST_WORKSPACE:?Set HOST_WORKSPACE to the host repo path}}
        target: /workspace
      # Overlay flat-file data dirs from HOST_DATA. Defaults to
      # HOST_WORKSPACE so they live in the same place by default.
      - type: bind
        source: ${HOST_ASSETS:-${HOST_DATA:-${HOST_WORKSPACE}}/assets}
        target: /workspace/assets
      - type: bind
        source: ${HOST_ARTIFACTS:-${HOST_DATA:-${HOST_WORKSPACE}}/artifacts}
        target: /workspace/artifacts
      - type: bind
        source: ${HOST_VENDOR:-${HOST_DATA:-${HOST_WORKSPACE}}/vendor}
        target: /workspace/vendor
      - type: bind
        source: ${WSL_LIBDXCORE_PATH:-/usr/lib/wsl/lib/libdxcore.so}
        target: /usr/lib/libdxcore.so
        read_only: true
      - type: bind
        source: ${WSL_LIBROCDXG_PATH:-${HOST_VENDOR:-${HOST_DATA:-${HOST_WORKSPACE}}/vendor}/rocdxg/librocdxg.so.1.2.0}
        target: /usr/lib/librocdxg.so
        read_only: true
      - type: volume
        source: qnn-pip-cache
        target: /home/trainer/.cache/pip
      - type: volume
        source: qnn-miopen-cache
        target: /home/trainer/.config/miopen
      - type: volume
        source: qnn-inductor-cache
        target: /home/trainer/.cache/torch/inductor
    devices:
      - /dev/dxg:/dev/dxg
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    ipc: host
    shm_size: ${TRAINING_SHM_SIZE:-2gb}
    stdin_open: true
    tty: true

volumes:
  qnn-pip-cache:
  qnn-miopen-cache:
  qnn-inductor-cache:
