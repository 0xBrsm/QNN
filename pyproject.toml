[project]
name = "quake-ai-v0"
version = "0.3.0"
description = "Transformer BC plus Sample Factory APPO pipeline for PvP Quake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "torch>=2.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
sf = [
  "sample-factory>=2.0.0",
  "gymnasium>=0.29.0"
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demo", "quake_ai", "quake_ai.model", "quake_ai.rl", "quake_ai.sf", "quake_ai.utils", "engine"]
