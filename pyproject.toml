[project]
name = "quake-ai-v0"
version = "0.1.0"
description = "V0 imitation-to-RL Quake agent baseline for E1M1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "torch>=2.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quake_ai", "quake_ai.data", "quake_ai.maps", "quake_ai.models", "quake_ai.rl", "quake_ai.utils", "engine"]
