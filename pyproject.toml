[project]
name = "qnn"
version = "0.3.0"
description = "Transformer BC plus native PPO fine-tuning pipeline for PvP Quake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
train = [
  "torch>=2.9.0"
]
corpus = [
  "smbprotocol>=1.10.0",
  "warcio>=1.7.0"
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demo", "engine", "mapgen", "qnn", "qnn.model", "qnn.model.graph", "qnn.model.tokens", "qnn.bc", "qnn.ppo", "qnn.eval", "qnn.env", "qnn.run", "qnn.utils"]

[tool.setuptools.package-data]
"qnn.model.graph" = ["bases/*.json"]
